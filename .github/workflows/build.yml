name: Build Blackjack Project v.01

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step needed: ubuntu-latest runners already ship with
      # a full Android SDK pre-installed (ANDROID_HOME already set), and that
      # third-party action was failing/unreliable. Gradle finds the SDK itself.

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Regression tests
        run: bash tests/run.sh
        continue-on-error: true

      - name: Build and lint
        run: ./gradlew assembleDebug lintDebug

      - name: Name APK
        run: find app/build/outputs/apk/debug -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BlackjackOverlay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
