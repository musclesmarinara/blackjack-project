name: Build Blackjack APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Restore source
        run: python3 Blackjack-Project-v.01-source.txt

      - name: Test and build
        working-directory: BlackjackProject
        run: |
          bash tests/run.sh
          bash gradlew assembleDebug lintDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Blackjack-Project-v.01.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Blackjack-Project-v.01
          path: Blackjack-Project-v.01.apk
          if-no-files-found: error
