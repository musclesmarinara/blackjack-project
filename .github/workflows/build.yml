name: Build Blackjack Project v.01
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Regression tests
        run: bash tests/run.sh
      - name: Build and lint
        run: bash gradlew assembleDebug lintDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Blackjack-Project-v.01.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Blackjack-Project-v.01
          path: Blackjack-Project-v.01.apk
          if-no-files-found: error
